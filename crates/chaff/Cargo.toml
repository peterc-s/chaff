[package]
name = "chaff"
description = "Library for implementing and testing Website Fingerprinting defences"
version = "0.1.0"
readme = "README.md"
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["capture"]
capture = ["dep:pcap"]

[dependencies]
mac_address = "1.1.8"
pcap = { version = "2.4.0", optional = true }

[[example]]
name = "capture"
path = "examples/capture.rs"
