[package]
name = "chaff"
description = "Library for implementing and testing Website Fingerprinting defences"
version = "0.1.0"
readme = "README.md"
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
borsh = ["dep:borsh"]

[dependencies]
borsh = { version = "1.6.1", optional = true, features = ["de_strict_order", "derive"] }
rand = "0.10.1"
rand_distr = "0.6.0"

[dev-dependencies]
tempfile = "3.27.0"
