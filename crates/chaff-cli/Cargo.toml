[package]
name = "chaff-cli"
description = "Command line for Chaff - a library for implementing Website Fingerprinting defences."
version = "0.1.0"
readme = "README.md"
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
chaff = { version = "0.1.0", path = "../chaff/" }
chaff-sim = { version = "0.1.0", path = "../chaff-sim/" }
chaff-machines = { version = "0.1.0", path = "../chaff-machines/" }
chaff-capture = { version = "0.1.0", path = "../chaff-capture/" }

bpaf = { version = "0.9.24", features = ["derive"] }
rand = "0.10.1"
mac_address = "1.1.8"
pcap = "2.4.0"
